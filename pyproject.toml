[project]
name = "mcp-scholarly"
version = "0.2.0"
description = "A MCP server to search for accurate academic articles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
 "arxiv>=2.1.3",
 "free-proxy>=1.1.3",
 "mcp>=2.0.0",
 "scholarly>=1.7.11",
]
[[project.authors]]
name = "Aditya Karnam"
email = "akarnam37@gmail.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
mcp-scholarly = "mcp_scholarly:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=mcp_scholarly --cov-report=term-missing"

[tool.coverage.run]
source = ["src/mcp_scholarly"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
